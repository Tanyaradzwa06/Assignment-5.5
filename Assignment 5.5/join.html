
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us | Campus Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-content">
            <h1>Join Our Club</h1>
            <p>Take the First Step Toward New Opportunities</p>
        </div>
    </header>

    <nav class="navbar">
        <div class="container nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="events.html">Events</a>
            <a class="active" href="join.html">Join Us</a>
        </div>
    </nav>

    <main class="container">
        <section class="section form-section">
            <h2>Membership Registration</h2>
            <p class="section-intro">
                Fill in the form below to express your interest in
                joining Campus Connect.
            </p>

            <form action="#" method="get">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" name="course" required>
                        <option value="">Select your course</option>
                        <option value="bca">BCA</option>
                        <option value="btech">B.Tech</option>
                        <option value="bba">BBA</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="interest">Area of Interest</label>
                    <select id="interest" name="interest" required>
                        <option value="">Select an interest</option>
                        <option value="technology">Technology</option>
                        <option value="photography">Photography</option>
                        <option value="cultural">Cultural Activities</option>
                        <option value="sports">Sports</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Why do you want to join?</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="4"
                        placeholder="Write a short message"
                    ></textarea>
                </div>

                <button type="submit" class="btn">Submit Application</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Campus Connect College Club. All rights reserved.</p>
    </footer>

</body>
</html>
